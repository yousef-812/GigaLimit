<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

            padding: 16px 32px; 
            background: #ffefb3; 
            color: #013e37; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 8px; 
            font-size: 1.2rem;
