<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة Giga Limit</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #013e37;
            --surface: rgba(0, 30, 25, 0.7);
            --primary: #ffefb3;
            --primary-hover: #e6d38a;
            --text: #ffefb3;
            --text-muted: rgba(255, 239, 179, 0.6);
            --border: rgba(255, 239, 179, 0.2);
            --success: #34d399;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .field { display: flex; flex-direction: column; gap: 4px; min-width: 140px; flex: 1; }
        .field-label { color: var(--text-muted); font-size: 0.75rem; }

        .glass {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        #login-view, #dashboard-view {
            display: none;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        #login-view.active, #dashboard-view.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box {
            max-width: 400px;
            margin: 10vh auto;
            padding: 2.5rem;
            text-align: center;
        }

        .login-box h1 {
            margin-top: 0;
            font-size: 2rem;
            color: var(--primary);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            box-sizing: border-box;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(255, 239, 179, 0.3);
        }
        select { width: auto; margin: 8px 0; }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        .header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .settings-panel {
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .settings-panel h3 {
            margin: 0;
            width: 100%;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .user-card {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-blocked { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .status-unlimited { background: rgba(167, 139, 250, 0.2); color: #a78bfa; }

        .usage-bar-bg {
            background: rgba(0,0,0,0.3);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }

        .usage-bar-fill {
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        .user-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn-small {
            width: auto;
            padding: 6px 12px;
            font-size: 0.875rem;
            background: rgba(255, 239, 179, 0.1);
            color: var(--primary);
            border: 1px solid var(--border);
        }
        
        .btn-small:hover {
            background: var(--primary);
            color: var(--bg);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }

        .btn-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.2);
        }
        .btn-success:hover { background: rgba(16, 185, 129, 0.2); }

        .limit-input-group {
            display: flex;
            gap: 0.5rem;
        }
        .limit-input-group input {
            margin: 0;
            padding: 6px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <div id="login-view" class="active">
        <div class="login-box glass">
            <h1>Giga Limit</h1>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">لوحة الإدارة المحلية</p>
            <input type="password" id="password" placeholder="كلمة مرور الإدارة" onkeypress="if(event.key === 'Enter') login()">
            <button onclick="login()">دخول لوحة التحكم</button>
            <p id="login-error" style="color: var(--danger); display: none; margin-top: 1rem; font-size: 0.875rem;">كلمة المرور غير صحيحة</p>
        </div>
    </div>

    <div id="dashboard-view">
        <div class="header" style="flex-wrap: wrap;">
            <div>
                <h1>لوحة التحكم</h1>
                <p id="server-time-display" style="color: var(--text-muted); margin-top: 4px; font-size: 0.875rem;">وقت السيرفر: جارٍ التحميل...</p>
            </div>
            <button style="width: auto; padding: 8px 16px; background: transparent; border: 1px solid var(--border); color: var(--text);" onclick="logout()">تسجيل الخروج</button>
        </div>

        <div class="settings-panel glass" style="justify-content: space-between; align-items: flex-start;">
            <div>
                <h3 style="color: var(--text-muted); font-size: 1rem; margin-bottom: 0.5rem;">إجمالي استهلاك الشبكة</h3>
                <p id="global-total-usage" style="font-size: 2rem; font-weight: 800; margin: 0; color: var(--primary);">0 MB</p>
            </div>
            <button class="btn-small btn-danger" style="width: auto;" onclick="resetGlobalTotal()">تصفير الإجمالي</button>
        </div>

        <div class="settings-panel glass">
            <h3>الإعدادات الافتراضية للأجهزة</h3>
            <div class="limit-input-group" style="width: 100%; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <div class="field"><label class="field-label">الحد اليومي (MB)</label><input type="number" id="global-limit" style="width: 100%;"></div>
                <div class="field"><label class="field-label">الحد الأسبوعي (MB)</label><input type="number" id="global-weekly-limit" style="width: 100%;"></div>
                <div class="field"><label class="field-label">السرعة العادية، 0 = مفتوحة</label><div style="display:flex; gap:4px;"><input type="number" id="global-speed-limit" min="0"><select id="global-speed-unit"><option value="1024">KB/s</option><option value="1048576">MB/s</option></select></div></div>
                <div class="field"><label class="field-label">السرعة بعد انتهاء الحصة، 0 = قطع</label><div style="display:flex; gap:4px;"><input type="number" id="global-exhausted-speed-limit" min="0"><select id="global-exhausted-speed-unit"><option value="1024">KB/s</option><option value="1048576">MB/s</option></select></div></div>
                <button class="btn-small" onclick="updateGlobalLimit()" style="width: 80px; background: var(--primary); color: var(--bg);">حفظ</button>
                <span id="global-msg" style="color: var(--success); font-size: 0.875rem; display: none;">تم الحفظ</span>
            </div>
        </div>
        
        <h2 id="connected-devices-header" onclick="handleSecretClick()" style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 1rem; cursor: pointer; user-select: none;">الأجهزة المسجلة</h2>
        <div class="card-grid" id="users-grid">
            <!-- Cards populated by JS -->
        </div>
    </div>

    <script>
        let authToken = sessionStorage.getItem('giga_token');
        let secretClicks = 0;
        let secretMode = false;
        let secretTimeout;
        let globalSettings = {};

        function speedParts(bytesPerSecond) {
            if (!bytesPerSecond) return { value: 0, unit: 1024 };
            if (bytesPerSecond >= 1048576) return { value: bytesPerSecond / 1048576, unit: 1048576 };
            return { value: bytesPerSecond / 1024, unit: 1024 };
        }

        function speedBps(value, unit) {
            return Math.max(0, Math.round((Number(value) || 0) * Number(unit)));
        }

        function speedUnitOptions(selected) {
            return `<option value="1024" ${selected === 1024 ? 'selected' : ''}>KB/s</option><option value="1048576" ${selected === 1048576 ? 'selected' : ''}>MB/s</option>`;
        }

        function handleSecretClick() {
            secretClicks++;
            if (secretClicks >= 10 && !secretMode) {
                secretMode = true;
                alert("تم تفعيل وضع تعديل الاستهلاك");
                loadUsers();
            }
            clearTimeout(secretTimeout);
            secretTimeout = setTimeout(() => { secretClicks = 0; }, 2000);
        }

        async function updateUsageSecret(id, daily_bytes, weekly_bytes) {
            await fetch('/api/admin/set_usage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
                body: JSON.stringify({ id, daily_bytes, weekly_bytes })
            });
            loadUsers();
        }

        if(authToken) {
            showDashboard();
        }

        async function login() {
            const pwd = document.getElementById('password').value;
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            });
            
            if(res.ok) {
                const data = await res.json();
                authToken = data.token;
                sessionStorage.setItem('giga_token', authToken);
                document.getElementById('password').value = '';
                document.getElementById('login-error').style.display = 'none';
                showDashboard();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('giga_token');
            authToken = null;
            document.getElementById('dashboard-view').classList.remove('active');
            document.getElementById('login-view').classList.add('active');
        }

        function showDashboard() {
            document.getElementById('login-view').classList.remove('active');
            document.getElementById('dashboard-view').classList.add('active');
            loadGlobalLimit();
            loadUsers();
            setInterval(loadUsers, 5000); // refresh every 5s
        }

        async function loadGlobalLimit() {
            if(!authToken) return;
            const res = await fetch('/api/admin/global_settings', { headers: { 'Authorization': authToken } });
            const data = await res.json();
            globalSettings = data;
            document.getElementById('global-limit').value = data.global_limit;
            document.getElementById('global-weekly-limit').value = data.global_weekly_limit;
            const speed = speedParts(data.global_speed_limit_bps);
            const exhaustedSpeed = speedParts(data.global_exhausted_speed_limit_bps);
            document.getElementById('global-speed-limit').value = speed.value;
            document.getElementById('global-speed-unit').value = speed.unit;
            document.getElementById('global-exhausted-speed-limit').value = exhaustedSpeed.value;
            document.getElementById('global-exhausted-speed-unit').value = exhaustedSpeed.unit;
            
            // Format global total
            let totalBytes = data.global_total_bytes || 0;
            let mb = totalBytes / (1024 * 1024);
            let displayStr = mb >= 1024 ? (mb / 1024).toFixed(2) + ' GB' : mb.toFixed(2) + ' MB';
            document.getElementById('global-total-usage').innerText = displayStr;
            document.getElementById('server-time-display').innerText = `تاريخ السيرفر: ${data.server_date} | الوقت: ${data.server_time}`;
        }

        async function updateGlobalLimit() {
            const val = document.getElementById('global-limit').value;
            const wVal = document.getElementById('global-weekly-limit').value;
            const speed = speedBps(document.getElementById('global-speed-limit').value, document.getElementById('global-speed-unit').value);
            const exhaustedSpeed = speedBps(document.getElementById('global-exhausted-speed-limit').value, document.getElementById('global-exhausted-speed-unit').value);
            await fetch('/api/admin/global_settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
                body: JSON.stringify({ global_limit: val, global_weekly_limit: wVal, global_speed_limit_bps: speed, global_exhausted_speed_limit_bps: exhaustedSpeed })
            });
            const msg = document.getElementById('global-msg');
            msg.style.display = 'inline';
            setTimeout(() => msg.style.display = 'none', 2000);
        }

        async function loadUsers() {
            if(!authToken) return;
            try {
                const res = await fetch('/api/admin/users?t=' + Date.now(), { headers: { 'Authorization': authToken } });
                if(res.status === 401) return logout();
                const users = await res.json();
                renderUsers(users);
            } catch (e) {
                console.error(e);
            }
        }

        function renderUsers(users) {
            const grid = document.getElementById('users-grid');
            const seenIds = new Set();

            if(users.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">لا توجد أجهزة مسجلة حتى الآن.</p>';
                return;
            }

            users.forEach(u => {
                seenIds.add(u.id);
                const usageMB = Math.round(u.bytes_used / (1024 * 1024)); 
                const weeklyUsageMB = Math.round((u.weekly_bytes_used || 0) / (1024 * 1024));
                const weeklyLimit = u.weekly_limit_mb || (u.daily_limit_mb * 7);
                const pct = u.status === 'unlimited' ? 0 : Math.min(100, (usageMB / u.daily_limit_mb) * 100);
                const wPct = u.status === 'unlimited' ? 0 : Math.min(100, (weeklyUsageMB / weeklyLimit) * 100);
                const statusLabel = { active: 'نشط', blocked: 'محظور', unlimited: 'غير محدود' }[u.status] || u.status;

                let card = document.getElementById(`user-card-${u.id}`);

                if (!card) {
                    card = createCard(u, usageMB, weeklyUsageMB, weeklyLimit, pct, wPct, statusLabel);
                    grid.appendChild(card);
                } else {
                    updateCard(card, u, usageMB, weeklyUsageMB, weeklyLimit, pct, wPct, statusLabel);
                }
            });

            grid.querySelectorAll('.user-card').forEach(card => {
                const id = Number(card.id.replace('user-card-', ''));
                if (!seenIds.has(id)) card.remove();
            });
        }

        function createCard(u, usageMB, weeklyUsageMB, weeklyLimit, pct, wPct, statusLabel) {
            const maxDaily = u.daily_limit_mb * 1024 * 1024;
            const maxWeekly = weeklyLimit * 1024 * 1024;
            const userSpeed = speedParts(u.speed_limit_bps ?? globalSettings.global_speed_limit_bps);
            const exhaustedSpeed = speedParts(u.exhausted_speed_limit_bps ?? globalSettings.global_exhausted_speed_limit_bps);

            const card = document.createElement('div');
            card.id = `user-card-${u.id}`;
            card.className = 'user-card glass';

            let barSection = '';
            if (u.status === 'unlimited') {
                barSection = `<div class="usage-bar-bg" style="display:none;" data-bar="daily"></div><div class="usage-bar-bg" style="margin-top:8px;display:none;" data-bar="weekly"></div>`;
            } else if (secretMode) {
                barSection = `<input type="range" data-bar="daily-range" style="width:100%; margin:8px 0; accent-color: var(--primary);" min="0" max="${maxDaily}" value="${u.bytes_used}" onchange="updateUsageSecret(${u.id}, this.value, ${u.weekly_bytes_used || 0})"><input type="range" data-bar="weekly-range" style="width:100%; margin:8px 0; accent-color: #a78bfa;" min="0" max="${maxWeekly}" value="${u.weekly_bytes_used || 0}" onchange="updateUsageSecret(${u.id}, ${u.bytes_used}, this.value)">`;
            } else {
                barSection = `<div class="usage-bar-bg" data-bar="daily"><div class="usage-bar-fill" style="width: ${pct}%; ${pct >= 100 ? 'background:var(--danger);' : ''}"></div></div><div class="usage-bar-bg" style="margin-top:8px;" data-bar="weekly"><div class="usage-bar-fill" style="width: ${wPct}%; ${wPct >= 100 ? 'background:var(--danger);' : 'background: linear-gradient(90deg, #a78bfa, #c084fc);'}"></div></div>`;
            }

            card.innerHTML = `
                <div class="user-header">
                    <h3 class="user-name">${u.name}</h3>
                    <span class="status-badge status-${u.status}" data-field="status-badge">${statusLabel}</span>
                </div>
                <div>
                    <div class="user-stats">
                        <span>استهلاك اليوم</span>
                        <span data-field="daily-usage">${u.status === 'unlimited' ? usageMB + ' MB' : usageMB + ' / ' + u.daily_limit_mb + ' MB'}</span>
                    </div>
                    ${barSection}
                    <div class="user-stats" style="margin-top: 8px;">
                        <span>استهلاك الأسبوع</span>
                        <span data-field="weekly-usage">${u.status === 'unlimited' ? weeklyUsageMB + ' MB' : weeklyUsageMB + ' / ' + weeklyLimit + ' MB'}</span>
                    </div>
                </div>
                <div class="limit-input-group" style="margin-top: 0.5rem; flex-direction: column;">
                    <div style="display:flex; gap: 0.5rem;">
                        <div class="field"><label class="field-label">حد اليوم (MB)</label><input type="number" id="limit-${u.id}" value="${u.daily_limit_mb}"></div>
                        <div class="field"><label class="field-label">حد الأسبوع (MB)</label><input type="number" id="wlimit-${u.id}" value="${weeklyLimit}"></div>
                    </div>
                    <button class="btn-small" onclick="updateUser(${u.id}, '${u.status}', document.getElementById('limit-${u.id}').value, document.getElementById('wlimit-${u.id}').value)">حفظ الحدود</button>
                </div>
                <div class="limit-input-group" style="margin-top: 0.5rem; flex-direction: column;">
                    <div style="display:flex; gap: 0.5rem; align-items:center;">
                        <div class="field"><label class="field-label">السرعة العادية، 0 = مفتوحة</label><input type="number" min="0" id="speed-${u.id}" value="${userSpeed.value}"></div>
                        <select id="speed-unit-${u.id}">${speedUnitOptions(userSpeed.unit)}</select>
                    </div>
                    <div style="display:flex; gap: 0.5rem; align-items:center;">
                        <div class="field"><label class="field-label">بعد انتهاء الحصة، 0 = قطع</label><input type="number" min="0" id="exhausted-speed-${u.id}" value="${exhaustedSpeed.value}"></div>
                        <select id="exhausted-speed-unit-${u.id}">${speedUnitOptions(exhaustedSpeed.unit)}</select>
                    </div>
                    <button class="btn-small" onclick="updateSpeed(${u.id}, '${u.status}', ${u.daily_limit_mb}, ${weeklyLimit})">حفظ السرعة</button>
                </div>
                <div class="card-actions">
                    <button class="btn-small" onclick="renewDaily(${u.id})">تجديد اليوم</button>
                    <button class="btn-small" onclick="renewWeekly(${u.id})">تجديد الأسبوع</button>
                    <button class="btn-small" style="color: var(--primary);" onclick="resetToDefault(${u.id})">إرجاع للإعدادات العامة</button>
                    <button class="btn-small" data-btn="unlimited" onclick="updateUser(${u.id}, '${u.status === 'unlimited' ? 'active' : 'unlimited'}', ${u.daily_limit_mb}, ${weeklyLimit})">
                        ${u.status === 'unlimited' ? 'إلغاء غير المحدود' : 'إنترنت غير محدود'}
                    </button>
                    <button class="btn-small ${u.status !== 'blocked' ? 'btn-danger' : 'btn-success'}" data-btn="block"
                            onclick="updateUser(${u.id}, '${u.status === 'blocked' ? 'active' : 'blocked'}', ${u.daily_limit_mb}, ${weeklyLimit})">
                        ${u.status === 'blocked' ? 'إلغاء الحظر' : 'حظر الإنترنت'}
                    </button>
                    <button class="btn-small btn-danger" style="grid-column: span 2; margin-top: 0.5rem;" onclick="deleteUser(${u.id})">
                        حذف الجهاز 🗑️
                    </button>
                    <button class="btn-small" style="grid-column: span 2; margin-top: 0.5rem; background: var(--primary); color: var(--bg);" onclick="sendNotification(${u.id})">
                        إرسال إشعار 🔔
                    </button>
                </div>
            `;
            return card;
        }

        function updateCard(card, u, usageMB, weeklyUsageMB, weeklyLimit, pct, wPct, statusLabel) {
            const badge = card.querySelector('[data-field="status-badge"]');
            if (badge) {
                badge.className = `status-badge status-${u.status}`;
                badge.textContent = statusLabel;
            }

            const dailyText = card.querySelector('[data-field="daily-usage"]');
            if (dailyText) dailyText.textContent = u.status === 'unlimited' ? usageMB + ' MB' : usageMB + ' / ' + u.daily_limit_mb + ' MB';

            const weeklyText = card.querySelector('[data-field="weekly-usage"]');
            if (weeklyText) weeklyText.textContent = u.status === 'unlimited' ? weeklyUsageMB + ' MB' : weeklyUsageMB + ' / ' + weeklyLimit + ' MB';

            const dailyBar = card.querySelector('[data-bar="daily"]');
            const weeklyBar = card.querySelector('[data-bar="weekly"]');
            const dailyFill = dailyBar ? dailyBar.querySelector('.usage-bar-fill') : null;
            const weeklyFill = weeklyBar ? weeklyBar.querySelector('.usage-bar-fill') : null;

            if (u.status === 'unlimited') {
                if (dailyBar) dailyBar.style.display = 'none';
                if (weeklyBar) weeklyBar.style.display = 'none';
            } else if (secretMode) {
                const dailyRange = card.querySelector('[data-bar="daily-range"]');
                const weeklyRange = card.querySelector('[data-bar="weekly-range"]');
                if (dailyRange) dailyRange.value = u.bytes_used;
                if (weeklyRange) weeklyRange.value = u.weekly_bytes_used || 0;
            } else {
                if (dailyBar) dailyBar.style.display = '';
                if (dailyFill) {
                    dailyFill.style.width = pct + '%';
                    dailyFill.style.background = pct >= 100 ? 'var(--danger)' : '';
                }
                if (weeklyBar) weeklyBar.style.display = '';
                if (weeklyFill) {
                    weeklyFill.style.width = wPct + '%';
                    weeklyFill.style.background = wPct >= 100 ? 'var(--danger)' : 'linear-gradient(90deg, #a78bfa, #c084fc)';
                }
            }

            const blockBtn = card.querySelector('[data-btn="block"]');
            if (blockBtn) {
                blockBtn.className = `btn-small ${u.status !== 'blocked' ? 'btn-danger' : 'btn-success'}`;
                blockBtn.textContent = u.status === 'blocked' ? 'إلغاء الحظر' : 'حظر الإنترنت';
                blockBtn.setAttribute('onclick', `updateUser(${u.id}, '${u.status === 'blocked' ? 'active' : 'blocked'}', ${u.daily_limit_mb}, ${weeklyLimit})`);
            }

            const unlimitedBtn = card.querySelector('[data-btn="unlimited"]');
            if (unlimitedBtn) {
                unlimitedBtn.textContent = u.status === 'unlimited' ? 'إلغاء غير المحدود' : 'إنترنت غير محدود';
                unlimitedBtn.setAttribute('onclick', `updateUser(${u.id}, '${u.status === 'unlimited' ? 'active' : 'unlimited'}', ${u.daily_limit_mb}, ${weeklyLimit})`);
            }
        }

        async function updateUser(id, status, daily_limit, weekly_limit) {
            await fetch('/api/admin/update_user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
                body: JSON.stringify({ id, status, daily_limit_mb: daily_limit, weekly_limit_mb: weekly_limit })
            });
            loadUsers();
        }

        async function updateSpeed(id, status, daily_limit, weekly_limit) {
            const speed = speedBps(document.getElementById(`speed-${id}`).value, document.getElementById(`speed-unit-${id}`).value);
            const exhaustedSpeed = speedBps(document.getElementById(`exhausted-speed-${id}`).value, document.getElementById(`exhausted-speed-unit-${id}`).value);
            await fetch('/api/admin/update_user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
                body: JSON.stringify({ id, status, daily_limit_mb: daily_limit, weekly_limit_mb: weekly_limit, speed_limit_bps: speed, exhausted_speed_limit_bps: exhaustedSpeed })
            });
            loadUsers();
        }

        async function sendNotification(id) {
            const message = prompt("اكتب الإشعار الذي تريد إرساله للمستخدم:");
            if (message && message.trim() !== "") {
                await fetch('/api/admin/send_notification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
                    body: JSON.stringify({ id, message: message.trim() })
                });
                alert("تم إرسال الإشعار");
            }
        }

        async function renewDaily(id) {
            await fetch('/api/admin/renew_daily', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
                body: JSON.stringify({ id })
            });
            loadUsers();
        }

        async function renewWeekly(id) {
            await fetch('/api/admin/renew_weekly', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
                body: JSON.stringify({ id })
            });
            loadUsers();
        }

        async function resetToDefault(id) {
            await fetch('/api/admin/reset_user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
                body: JSON.stringify({ id })
            });
            loadUsers();
        }

        async function resetGlobalTotal() {
            if (confirm("هل تريد تصفير إجمالي استهلاك الشبكة؟")) {
                await fetch('/api/admin/reset_global_total', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': authToken }
                });
                loadGlobalLimit();
            }
        }

        async function deleteUser(id) {
            if (confirm("هل تريد حذف هذا الجهاز نهائياً؟")) {
                await fetch('/api/admin/delete_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
                    body: JSON.stringify({ id })
                });
                const card = document.getElementById(`user-card-${id}`);
                if (card) card.remove();
                loadUsers();
            }
        }
    </script>
</body>
</html>
