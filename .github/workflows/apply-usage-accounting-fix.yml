name: Apply Usage Accounting Fix

on:
  push:
    branches: [agent/fix-usage-accounting]
    paths:
      - .github/workflows/apply-usage-accounting-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-usage-accounting
          fetch-depth: 0

      - name: Patch TCP, UDP, QUIC, and IPv6 accounting
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing patch anchor: {label}")
              return text.replace(old, new, 1)

          index_path = Path('server/index.js')
          text = index_path.read_text()

          text = replace_once(
              text,
              "const db = require('./db');\n",
              "const db = require('./db');\nconst { createUsageMeter } = require('./usage_meter');\n",
              'usage meter import',
          )

          normalize_anchor = """const normalizeIp = (ip = '') => {
              if (ip.startsWith('::ffff:')) return ip.substring(7);
              if (ip === '::1') return '127.0.0.1';
              return ip;
          };
          """
          ipv6_helpers = normalize_anchor + """
          const ipv6BufferToString = (buffer) => {
              if (!Buffer.isBuffer(buffer) || buffer.length !== 16) return '';
              const groups = [];
              for (let offset = 0; offset < 16; offset += 2) {
                  groups.push(buffer.readUInt16BE(offset).toString(16));
              }
              return groups.join(':');
          };

          const ipv6StringToBuffer = (address) => {
              const clean = String(address || '').split('%')[0].toLowerCase();
              const convertEmbeddedIpv4 = (parts) => {
                  if (!parts.length || !parts[parts.length - 1].includes('.')) return parts;
                  const octets = parts.pop().split('.').map(Number);
                  if (octets.length !== 4 || octets.some(octet => !Number.isInteger(octet) || octet < 0 || octet > 255)) {
                      return null;
                  }
                  parts.push(((octets[0] << 8) | octets[1]).toString(16));
                  parts.push(((octets[2] << 8) | octets[3]).toString(16));
                  return parts;
              };

              const halves = clean.split('::');
              if (halves.length > 2) return null;
              let head = halves[0] ? halves[0].split(':') : [];
              let tail = halves.length === 2 && halves[1] ? halves[1].split(':') : [];
              head = convertEmbeddedIpv4(head);
              tail = convertEmbeddedIpv4(tail);
              if (!head || !tail) return null;

              const missing = 8 - head.length - tail.length;
              if ((halves.length === 1 && missing !== 0) || missing < 0) return null;
              const groups = [...head, ...Array(missing).fill('0'), ...tail];
              if (groups.length !== 8) return null;

              const result = Buffer.alloc(16);
              for (let index = 0; index < groups.length; index++) {
                  const value = Number.parseInt(groups[index] || '0', 16);
                  if (!Number.isInteger(value) || value < 0 || value > 0xffff) return null;
                  result.writeUInt16BE(value, index * 2);
              }
              return result;
          };
          """
          text = replace_once(text, normalize_anchor, ipv6_helpers, 'IPv6 helpers')

          proxy_start = """const proxyServer = http.createServer((req, res) => {
              let clientIp = req.socket.remoteAddress;
              if (clientIp.includes('::ffff:')) clientIp = clientIp.split('::ffff:')[1];

              const parsedUrl = url.parse(req.url);
          """
          proxy_start_new = """const proxyServer = http.createServer((req, res) => {
              let clientIp = req.socket.remoteAddress;
              if (clientIp.includes('::ffff:')) clientIp = clientIp.split('::ffff:')[1];

              const user = db.getUserByIp(clientIp);
              const usageMeter = createUsageMeter(db, user ? user.id : null);
              res.once('close', () => usageMeter.stop());

              const parsedUrl = url.parse(req.url);
          """
          text = replace_once(text, proxy_start, proxy_start_new, 'HTTP usage meter')
          text = replace_once(
              text,
              "rateLimitedPipe(proxyRes, res, () => getSpeedForIp(clientIp), clientIp);",
              "rateLimitedPipe(proxyRes, res, () => getSpeedForIp(clientIp), clientIp, bytes => usageMeter.add(bytes));",
              'HTTP download accounting',
          )
          text = replace_once(
              text,
              "rateLimitedPipe(req, proxyReq, () => getSpeedForIp(clientIp), clientIp);",
              "rateLimitedPipe(req, proxyReq, () => getSpeedForIp(clientIp), clientIp, bytes => usageMeter.add(bytes));",
              'HTTP upload accounting',
          )

          text = replace_once(
              text,
              "function rateLimitedPipe(source, destination, getSpeed, ip) {",
              "function rateLimitedPipe(source, destination, getSpeed, ip, onBytes = () => {}) {",
              'rate limited pipe signature',
          )
          transform_anchor = """            const bytesPerSecond = getSpeed();
                      if (bytesPerSecond <= 0) return callback(new Error('User speed limit reached'));
                      if (bytesPerSecond === Infinity) return callback(null, chunk);
          """
          transform_new = """            const bytesPerSecond = getSpeed();
                      if (bytesPerSecond <= 0) return callback(new Error('User speed limit reached'));
                      onBytes(chunk.length);
                      if (bytesPerSecond === Infinity) return callback(null, chunk);
          """
          text = replace_once(text, transform_anchor, transform_new, 'TCP byte callback')

          udp_send_old = """function sendRateLimitedUdp(socket, message, port, host, getSpeed, ip) {
              const bytesPerSecond = getSpeed();
              if (bytesPerSecond <= 0) return;
              const send = () => socket.send(message, port, host);
          """
          udp_send_new = """function sendRateLimitedUdp(socket, message, port, host, getSpeed, ip, onBytes = () => {}) {
              const bytesPerSecond = getSpeed();
              if (bytesPerSecond <= 0) return;
              const send = () => {
                  onBytes(message.length);
                  socket.send(message, port, host);
              };
          """
          text = replace_once(text, udp_send_old, udp_send_new, 'UDP byte callback')

          connect_try = """    try {
                  const serverSocket = net.connect(port || 443, hostname, () => {
          """
          connect_try_new = """    try {
                  const user = db.getUserByIp(clientIp);
                  const usageMeter = createUsageMeter(db, user ? user.id : null);
                  const serverSocket = net.connect(port || 443, hostname, () => {
          """
          text = replace_once(text, connect_try, connect_try_new, 'CONNECT usage meter')
          text = replace_once(
              text,
              "rateLimitedPipe(clientSocket, serverSocket, () => getSpeedForIp(clientIp), clientIp);\n                rateLimitedPipe(serverSocket, clientSocket, () => getSpeedForIp(clientIp), clientIp);",
              "rateLimitedPipe(clientSocket, serverSocket, () => getSpeedForIp(clientIp), clientIp, bytes => usageMeter.add(bytes));\n                rateLimitedPipe(serverSocket, clientSocket, () => getSpeedForIp(clientIp), clientIp, bytes => usageMeter.add(bytes));",
              'CONNECT bidirectional accounting',
          )
          connect_stats_start = text.index("        const user = db.getUserByIp(clientIp);\n        const userId = user ? user.id : null;", text.index("proxyServer.on('connect'"))
          connect_stats_end_marker = """        clientSocket.on('error', () => {
                      if (serverSocket) serverSocket.destroy();
                  });
          """
          connect_stats_end = text.index(connect_stats_end_marker, connect_stats_start) + len(connect_stats_end_marker)
          connect_replacement = """        const stopUsageMeter = () => usageMeter.stop();
                  serverSocket.once('close', stopUsageMeter);
                  clientSocket.once('close', stopUsageMeter);
                  serverSocket.on('error', () => clientSocket.destroy());
                  clientSocket.on('error', () => {
                      if (serverSocket) serverSocket.destroy();
                  });
          """
          text = text[:connect_stats_start] + connect_replacement + text[connect_stats_end:]

          atyp_old = """            } else if (atyp === 0x03) {
                          const domainLen = reqData[4];
                          host = reqData.toString('utf8', 5, 5 + domainLen);
                          portOffset = 5 + domainLen;
                      } else {
          """
          atyp_new = """            } else if (atyp === 0x03) {
                          const domainLen = reqData[4];
                          host = reqData.toString('utf8', 5, 5 + domainLen);
                          portOffset = 5 + domainLen;
                      } else if (atyp === 0x04 && reqData.length >= 22) {
                          host = ipv6BufferToString(reqData.subarray(4, 20));
                          portOffset = 20;
                      } else {
          """
          text = replace_once(text, atyp_old, atyp_new, 'SOCKS TCP IPv6 parsing')

          socks_connect = """            try {
                          const serverSocket = net.connect(port, host, () => {
          """
          socks_connect_new = """            try {
                          const user = db.getUserByIp(clientIp);
                          const usageMeter = createUsageMeter(db, user ? user.id : null);
                          const serverSocket = net.connect(port, host, () => {
          """
          text = replace_once(text, socks_connect, socks_connect_new, 'SOCKS TCP usage meter')
          text = replace_once(
              text,
              "rateLimitedPipe(clientSocket, serverSocket, () => getSpeedForIp(clientIp), clientIp);\n                    rateLimitedPipe(serverSocket, clientSocket, () => getSpeedForIp(clientIp), clientIp);",
              "rateLimitedPipe(clientSocket, serverSocket, () => getSpeedForIp(clientIp), clientIp, bytes => usageMeter.add(bytes));\n                    rateLimitedPipe(serverSocket, clientSocket, () => getSpeedForIp(clientIp), clientIp, bytes => usageMeter.add(bytes));",
              'SOCKS TCP bidirectional accounting',
          )
          socks_stats_start = text.index("                const user = db.getUserByIp(clientIp);\n                const userId = user ? user.id : null;", text.index("const socksServer"))
          socks_stats_end_marker = """                clientSocket.on('error', () => {
                              if (serverSocket) serverSocket.end();
                          });
          """
          socks_stats_end = text.index(socks_stats_end_marker, socks_stats_start) + len(socks_stats_end_marker)
          socks_replacement = """                const stopUsageMeter = () => usageMeter.stop();
                          serverSocket.once('close', stopUsageMeter);
                          clientSocket.once('close', stopUsageMeter);
                          serverSocket.on('error', () => clientSocket.end());
                          clientSocket.on('error', () => {
                              if (serverSocket) serverSocket.end();
                          });
          """
          text = text[:socks_stats_start] + socks_replacement + text[socks_stats_end:]

          udp_start = text.index('function handleSocksUdpAssociation(clientSocket, clientIp) {')
          udp_end = text.index('\nsocksServer.listen(1080', udp_start)
          udp_function = r'''function handleSocksUdpAssociation(clientSocket, clientIp) {
              const relay4 = dgram.createSocket('udp4');
              const relay6 = dgram.createSocket('udp6');
              const user = db.getUserByIp(clientIp);
              const usageMeter = createUsageMeter(db, user ? user.id : null);
              let clientUdpPort = null;
              let closed = false;

              const closeRelays = () => {
                  if (closed) return;
                  closed = true;
                  usageMeter.stop();
                  try { relay4.close(); } catch (_) {}
                  try { relay6.close(); } catch (_) {}
              };

              const sendToClient = (header, message) => {
                  if (clientUdpPort === null) return;
                  sendRateLimitedUdp(
                      relay4,
                      Buffer.concat([header, message]),
                      clientUdpPort,
                      clientIp,
                      () => getSpeedForIp(clientIp),
                      clientIp,
                      bytes => usageMeter.add(bytes)
                  );
              };

              clientSocket.once('close', closeRelays);
              clientSocket.once('error', closeRelays);
              relay4.on('error', closeRelays);
              relay6.on('error', closeRelays);

              relay4.on('message', (message, rinfo) => {
                  if (rinfo.address === clientIp && (clientUdpPort === null || rinfo.port === clientUdpPort)) {
                      clientUdpPort = rinfo.port;
                      if (message.length < 10 || message[0] !== 0 || message[1] !== 0 || message[2] !== 0) return;

                      const atyp = message[3];
                      let host;
                      let portOffset;
                      let upstream = relay4;
                      if (atyp === 0x01) {
                          host = `${message[4]}.${message[5]}.${message[6]}.${message[7]}`;
                          portOffset = 8;
                      } else if (atyp === 0x03) {
                          const domainLength = message[4];
                          if (message.length < 5 + domainLength + 2) return;
                          host = message.toString('utf8', 5, 5 + domainLength);
                          portOffset = 5 + domainLength;
                      } else if (atyp === 0x04) {
                          if (message.length < 22) return;
                          host = ipv6BufferToString(message.subarray(4, 20));
                          portOffset = 20;
                          upstream = relay6;
                      } else {
                          return;
                      }

                      if (message.length < portOffset + 2) return;
                      const port = message.readUInt16BE(portOffset);
                      sendRateLimitedUdp(
                          upstream,
                          message.subarray(portOffset + 2),
                          port,
                          host,
                          () => getSpeedForIp(clientIp),
                          clientIp,
                          bytes => usageMeter.add(bytes)
                      );
                      return;
                  }

                  if (clientUdpPort === null || rinfo.address === clientIp) return;
                  const octets = rinfo.address.split('.').map(Number);
                  if (octets.length !== 4 || octets.some(Number.isNaN)) return;
                  const header = Buffer.from([
                      0x00, 0x00, 0x00, 0x01,
                      ...octets,
                      rinfo.port >> 8, rinfo.port & 0xff
                  ]);
                  sendToClient(header, message);
              });

              relay6.on('message', (message, rinfo) => {
                  const address = ipv6StringToBuffer(rinfo.address);
                  if (!address) return;
                  const header = Buffer.concat([
                      Buffer.from([0x00, 0x00, 0x00, 0x04]),
                      address,
                      Buffer.from([rinfo.port >> 8, rinfo.port & 0xff])
                  ]);
                  sendToClient(header, message);
              });

              relay6.bind(0, '::');
              relay4.bind(0, '0.0.0.0', () => {
                  const relayPort = relay4.address().port;
                  let localIp = clientSocket.localAddress || '0.0.0.0';
                  if (localIp.startsWith('::ffff:')) localIp = localIp.substring(7);
                  const octets = localIp.split('.').map(Number);
                  const replyIp = octets.length === 4 && octets.every(Number.isFinite) ? octets : [0, 0, 0, 0];
                  clientSocket.write(Buffer.from([
                      0x05, 0x00, 0x00, 0x01,
                      ...replyIp,
                      relayPort >> 8, relayPort & 0xff
                  ]));
              });
          }
          '''
          text = text[:udp_start] + udp_function + text[udp_end:]
          index_path.write_text(text)

          vpn_path = Path('mobile_app/android/app/src/main/kotlin/com/example/mobile_app/VpnProxyService.kt')
          vpn = vpn_path.read_text()
          vpn = replace_once(
              vpn,
              '        builder.addAddress("10.0.0.2", 32)\n        builder.addRoute("0.0.0.0", 0)\n',
              '        builder.addAddress("10.0.0.2", 32)\n        builder.addRoute("0.0.0.0", 0)\n        builder.addAddress("fd00:1:fd00:1::1", 128)\n        builder.addRoute("::", 0)\n',
              'Android IPv6 routing',
          )
          vpn_path.write_text(vpn)

          tun_path = Path('mobile_app/tun2socks/main.go')
          tun = tun_path.read_text()
          tun = replace_once(
              tun,
              '''\t\t\thdr := []byte{0, 0, 0, 0x01}\n\t\t\thdr = append(hdr, dstIP.To4()...)\n\t\t\thdr = append(hdr, byte(dstPort>>8), byte(dstPort))\n\t\t\tdgram := append(hdr, buf[:n]...)\n''',
              '''\t\t\tvar hdr []byte\n\t\t\tif v4 := dstIP.To4(); v4 != nil {\n\t\t\t\thdr = []byte{0, 0, 0, 0x01}\n\t\t\t\thdr = append(hdr, v4...)\n\t\t\t} else if v6 := dstIP.To16(); v6 != nil {\n\t\t\t\thdr = []byte{0, 0, 0, 0x04}\n\t\t\t\thdr = append(hdr, v6...)\n\t\t\t} else {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\thdr = append(hdr, byte(dstPort>>8), byte(dstPort))\n\t\t\tdgram := append(hdr, buf[:n]...)\n''',
              'tun2socks IPv6 UDP framing',
          )
          tun_path.write_text(tun)
          PY

          gofmt -w mobile_app/tun2socks/main.go
          git diff --check
          node --check server/index.js
          node --check server/usage_meter.js
          node --test server/test/*.test.js

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/index.js server/usage_meter.js server/test/usage_accounting.test.js mobile_app/android/app/src/main/kotlin/com/example/mobile_app/VpnProxyService.kt mobile_app/tun2socks/main.go
          git commit -m "Fix usage accounting across UDP, QUIC, and IPv6"
          git push origin HEAD:agent/fix-usage-accounting
