name: Finalize Security Hotfix

on:
  push:
    branches: [agent/security-hotfix]
    paths:
      - tools/finalize_hotfix.py
      - .github/workflows/finalize-hotfix.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-hotfix
          fetch-depth: 0

      - name: Apply cleanup
        run: python tools/finalize_hotfix.py

      - name: Capture server syntax result
        run: |
          set +e
          {
            node --check server/index.js
            node --check server/db.js
            node --check server/build_bundle.js
          } > /tmp/finalize-syntax.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/finalize-syntax.log
          if [ "$STATUS" -ne 0 ]; then
            cp /tmp/finalize-syntax.log finalize_syntax_error.txt
          else
            rm -f finalize_syntax_error.txt
          fi

      - name: Commit cleanup and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "Finalize security hotfix"
          git push origin HEAD:agent/security-hotfix
