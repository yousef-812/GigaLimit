name: Fix Flutter Certificate Fingerprint

on:
  push:
    branches: [agent/security-hotfix]
    paths:
      - tools/fix_flutter_certificate_fingerprint.py
      - .github/workflows/fix-flutter-fingerprint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-hotfix
          fetch-depth: 0

      - name: Apply Flutter fix
        run: python tools/fix_flutter_certificate_fingerprint.py

      - name: Commit Flutter source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile_app/lib/main.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Flutter source change to commit"
            exit 0
          fi
          git commit -m "Fix Flutter certificate fingerprint encoding"
          git pull --rebase origin agent/security-hotfix
          git push origin HEAD:agent/security-hotfix
