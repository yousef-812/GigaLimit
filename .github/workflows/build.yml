name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build tun2socks for Android ARM64
        working-directory: mobile_app/tun2socks
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -trimpath -o ../android/app/src/main/assets/tun2socks_arm64-v8a .

      - name: Build tun2socks for Android ARM
        working-directory: mobile_app/tun2socks
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -trimpath -o ../android/app/src/main/assets/tun2socks_armeabi-v7a .

      - name: Verify binaries
        run: ls -lh mobile_app/android/app/src/main/assets/tun2socks_*

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Flutter pub get
        working-directory: mobile_app
        run: flutter pub get

      - name: Build APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Create Tag
        run: |
          TAG="v1.0.0-${{ github.run_number }}"
          git tag $TAG
          git push origin $TAG

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "GigaLimit v1.0.0-${{ github.run_number }}"
          files: mobile_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
