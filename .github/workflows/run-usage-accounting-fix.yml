name: Run Usage Accounting Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-usage-accounting-fix.yml

permissions:
  contents: write

jobs:
  patch-target-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-usage-accounting
          fetch-depth: 0

      - name: Extract and run the reviewed patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-usage-accounting-fix.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(workflow[start + 1:end])) + '\n'
          Path('/tmp/apply_usage_fix.py').write_text(script)
          PY
          python /tmp/apply_usage_fix.py
          gofmt -w mobile_app/tun2socks/main.go
          git diff --check
          node --check server/index.js
          node --check server/usage_meter.js
          node --test server/test/*.test.js

      - name: Commit the fix to the target branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/index.js server/usage_meter.js server/test/usage_accounting.test.js mobile_app/android/app/src/main/kotlin/com/example/mobile_app/VpnProxyService.kt mobile_app/tun2socks/main.go
          git commit -m "Fix usage accounting across UDP, QUIC, and IPv6"
          git push origin HEAD:agent/fix-usage-accounting

# One-shot trigger: usage accounting repair
