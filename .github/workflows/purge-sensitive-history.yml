name: Prepare Clean History Ref Map

on:
  push:
    branches: [agent/security-hotfix]
    paths:
      - .github/workflows/purge-sensitive-history.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Install git-filter-repo
        run: python -m pip install --disable-pip-version-check git-filter-repo

      - name: Mirror repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          git for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags | sort > ../original-refs.txt

      - name: Rewrite sensitive history locally
        working-directory: repo.git
        run: |
          git filter-repo --force \
            --path server/public_bundle.js \
            --invert-paths \
            --blob-callback 'import re; blob.data = re.sub(br"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----.*?-----END (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----", b"[REDACTED PRIVATE KEY]", blob.data, flags=re.S)'

      - name: Verify rewritten object graph
        working-directory: repo.git
        run: |
          if git rev-list --objects --all | grep -F 'server/public_bundle.js'; then
            echo 'server/public_bundle.js is still reachable after filtering' >&2
            exit 1
          fi
          python - <<'PY'
          import re
          import subprocess
          import sys

          pem = re.compile(br"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----")
          bad = []
          objects = subprocess.check_output(
              ["git", "rev-list", "--objects", "--all"], text=True
          ).splitlines()
          for entry in objects:
              sha, *path = entry.split(" ", 1)
              object_type = subprocess.check_output(
                  ["git", "cat-file", "-t", sha], text=True
              ).strip()
              if object_type != "blob":
                  continue
              data = subprocess.check_output(["git", "cat-file", "-p", sha])
              if pem.search(data):
                  bad.append(path[0] if path else sha)
          if bad:
              print("Private-key material remains reachable:", *bad, sep="\n- ")
              sys.exit(1)
          print("Verified: no exposed bundle path or PEM private-key blocks remain.")
          PY

      - name: Record rewritten refs
        working-directory: repo.git
        run: |
          git for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags | sort > ../rewritten-refs.txt
          cat ../rewritten-refs.txt

      - name: Upload ref maps
        uses: actions/upload-artifact@v4
        with:
          name: clean-history-ref-map
          path: |
            original-refs.txt
            rewritten-refs.txt
            repo.git/filter-repo/commit-map
            repo.git/filter-repo/ref-map
          retention-days: 1

      - name: Stop before moving refs
        run: |
          echo 'Ref map prepared; branch move is performed through the GitHub connector.'
          exit 1
